version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Pas de frontend à builder dans ce projet"
    build:
      commands:
        - echo "Build frontend ignoré"
  artifacts:
    baseDirectory: /
    files:
      - '**/*'
backend:
  phases:
    preBuild:
      commands:
        - echo "📁 Phase preBuild - Copie des fichiers sources..."
        # Création des dossiers de destination
        - mkdir -p amplify/backend/function/expressApi/src/routes
        - mkdir -p amplify/backend/function/expressApi/src/models
        - mkdir -p amplify/backend/function/expressApi/src/config
        # Copie des fichiers depuis la racine vers le dossier Amplify
        - echo "   -> Copie des routes"
        - cp -r routes/* amplify/backend/function/expressApi/src/routes/ 2>/dev/null || echo "      (aucune route copiée)"
        - echo "   -> Copie des models"
        - cp -r models/* amplify/backend/function/expressApi/src/models/ 2>/dev/null || echo "      (aucun model copié)"
        - echo "   -> Copie de la config"
        - cp -r config/* amplify/backend/function/expressApi/src/config/ 2>/dev/null || echo "      (aucune config copiée)"
        - echo "   -> Copie de server.js vers app.js"
        - cp server.js amplify/backend/function/expressApi/src/app.js 2>/dev/null || echo "      (server.js non trouvé)"
        - echo "✅ Préparation terminée."
    build:
      commands:
        - echo "🚀 Exécution de amplifyPush --simple"
        - amplifyPush --simple
  artifacts:
    baseDirectory: / # Important pour le déploiement
    files:
      - '**/*'